org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Some third-party plugins (e.g. receive_sharing_intent) leave Kotlin's jvmTarget
# at the JDK default (21) while their Java stays at 1.8, which trips Kotlin's
# strict JVM-target consistency check. Relax it to a warning so mixed-target
# plugin modules still build; D8 dexes the mixed class files fine (minSdk 26).
kotlin.jvm.target.validation.mode=warning
